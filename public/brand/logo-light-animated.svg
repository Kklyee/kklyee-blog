<svg class="kklyee-logo kklyee-logo--dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 112" role="img" aria-labelledby="title desc">
  <title id="title">Kklyee.dev</title>
  <desc id="desc">Animated light-mode Kklyee.dev wordmark.</desc>

  <style>
    #letter-Kk {
      animation: mark-reveal .72s cubic-bezier(.22,.75,.22,1) both;
      transform-box: fill-box;
      transform-origin: center;
    }

    #word-lyee,
    #e-cut,
    #suffix-dev {
      opacity: 0;
      transform: translateY(3px);
      animation: reveal .38s ease-out .44s both;
    }

    #e-cut {
      animation-duration: .24s;
      animation-delay: .58s;
    }

    #suffix-dev {
      animation-delay: .6s;
    }

    #period-ring,
    #period-core {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: ring-arrive .62s cubic-bezier(.18,.82,.25,1.15) .72s both;
    }

    #period-core {
      animation-delay: .92s;
    }

    #orbit {
      opacity: 0;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: orbit-draw .5s ease-out .68s both,
        orbit-vanish .25s ease-in 1.18s both;
    }

    @keyframes mark-reveal {
      0% {
        clip-path: inset(0 100% 0 0);
        opacity: 0;
        transform: translateX(-4px);
      }

      15% {
        opacity: 1;
      }

      100% {
        clip-path: inset(0 0 0 0);
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes reveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes ring-arrive {
      0% {
        opacity: 0;
        transform: translateX(-18px) rotate(-120deg) scale(.45);
      }

      70% {
        opacity: 1;
        transform: translateX(2px) rotate(8deg) scale(1.12);
      }

      100% {
        opacity: 1;
        transform: translateX(0) rotate(0) scale(1);
      }
    }

    @keyframes orbit-draw {
      from {
        opacity: 0;
        stroke-dashoffset: 1;
      }

      to {
        opacity: 1;
        stroke-dashoffset: 0;
      }
    }

    @keyframes orbit-vanish {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #letter-Kk,
      #word-lyee,
      #e-cut,
      #period-ring,
      #period-core,
      #suffix-dev {
        animation: none;
        clip-path: none;
        opacity: 1;
        transform: none;
      }

      #orbit {
        display: none;
      }
    }
  </style>

  <g id="logo-dark">
    <path id="letter-Kk" fill="#5C7CFF" d="M 21.3848 85.9679 L 23.5434 85.8222 L 24.8295 85.7893 L 26.1613 85.7988 L 28.4245 85.9003 L 28.4516 76.5410 L 28.3530 62.0735 L 30.5534 59.8613 L 35.6188 55.1233 L 37.8226 52.8911 L 39.4515 54.8206 L 41.3494 57.2596 L 52.9139 72.6859 L 58.0169 79.4473 L 61.7903 84.2797 L 63.0087 85.7616 L 64.4371 87.3893 L 68.7551 87.9940 L 70.0251 88.2160 L 73.6592 88.4943 L 65.2351 77.5443 L 63.5859 75.4884 L 61.9121 73.4635 L 65.3238 70.5636 L 67.3893 69.0810 L 70.9812 73.1402 L 79.1189 83.1221 L 81.4412 85.8279 L 83.5971 88.2089 L 87.1305 88.1030 L 92.0494 88.1509 L 84.0551 78.5374 L 72.1503 64.4489 L 73.6601 62.6189 L 75.6548 60.3096 L 83.2460 51.9999 L 87.1963 47.5525 L 77.8944 47.5489 L 74.9246 51.0923 L 71.7235 54.7587 L 58.0699 68.0911 L 56.5862 66.4390 L 55.2735 64.8407 L 47.1954 54.1368 L 42.9665 48.4651 L 44.7760 46.8411 L 46.8955 44.8806 L 54.6036 37.5224 L 61.1227 31.2602 L 66.9064 25.6567 L 71.1593 21.7209 L 59.9429 23.2939 L 56.8654 26.6282 L 51.5747 31.8270 L 46.7528 36.3471 L 41.0687 41.5861 L 35.0738 47.2123 L 31.7780 50.1720 L 28.3834 53.0123 L 28.3129 44.6734 L 28.3410 24.0929 L 24.7483 24.0669 L 21.2524 24.1181 L 21.2145 66.1819 L 21.2647 77.8763 L 21.3848 85.9679 Z" />
  </g>

  <text id="word-lyee" x="91" y="86" fill="#111318" font-family="IBM Plex Mono, monospace" font-size="68" font-weight="500" letter-spacing="-2.4">lyee</text>

  <path id="e-cut" d="M222 76H232" stroke="#111318" stroke-width="3" />

  <path id="orbit" pathLength="1" d="M216 77c9-16 23-17 31 0" fill="none" stroke="#5C7CFF" stroke-width="1.6" />

  <circle id="period-ring" cx="247" cy="77" r="7" fill="none" stroke="#5C7CFF" stroke-width="3" />

  <circle id="period-core" cx="247" cy="77" r="2" fill="#5C7CFF" />

  <text id="suffix-dev" x="264" y="84" fill="#111318" font-family="IBM Plex Mono, monospace" font-size="45" font-weight="300" letter-spacing="-1.2">dev</text>
</svg>
